name: Activity overview

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw chart
        env:
          # ACTIVITY_TOKEN (read-only, with private repo access) counts private
          # activity too; without it only public activity is counted.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/activity.py "${{ github.repository_owner }}" dist

      - name: Publish to the activity branch
        run: |
          cd dist
          git init -q -b activity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update activity overview"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" activity
